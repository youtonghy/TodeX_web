name: docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.3 or v1.2.3'
        required: true
        type: string
      protocol_ref:
        description: 'Branch or tag of youtonghy/TodeX_protocol to compile the protocol sources from (default: repository default branch)'
        required: false
        default: ''
        type: string
      latest:
        description: 'Also tag the image as latest'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION" >&2
            exit 1
          fi
          echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          if [ -z "$HEROUI_KEY" ]; then
            echo "::error::Repository secret HEROUI_KEY is not set; hpsetup cannot fetch the licensed @heroui-pro/react contents without it." >&2
            exit 1
          fi

      - name: Check out TodeX_web
        uses: actions/checkout@v4
        with:
          path: TodeX_web

      - name: Check out TodeX protocol sources
        uses: actions/checkout@v4
        with:
          repository: youtonghy/TodeX_protocol
          path: TodeX_protocol
          ref: ${{ inputs.protocol_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          TAG_LATEST: ${{ inputs.latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$image:${{ steps.version.outputs.version }}"
            if [ "$TAG_LATEST" = "true" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: TodeX_web
          build-contexts: |
            todexprotocol=${{ github.workspace }}/TodeX_protocol
          push: true
          platforms: linux/amd64
          build-args: |
            TODEX_BUILD_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            HEROUI_KEY=${{ secrets.HEROUI_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
