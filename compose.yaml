# Runs the published TodeX Web image. Copy .env.example to .env to set
# TODEX_BACKENDS (the backends this deployment serves) and PORT.
#
#   docker compose pull && docker compose up -d
#
# To build the image locally instead, layer compose.build.yaml on top:
#
#   HEROUI_KEY=hp_... docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  web:
    image: ghcr.io/youtonghy/todex_web:${TODEX_WEB_TAG:-latest}
    restart: unless-stopped
    read_only: true
    ports:
      - "${PORT:-4173}:4173"
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      # Backends this deployment serves, e.g. "Home=http://192.168.1.20:7345,Office=https://office.lan:7345".
      # Browsers reach them only through this server; each device still pairs
      # with each backend. Empty keeps the public site with user-added backends.
      TODEX_BACKENDS: ${TODEX_BACKENDS:-}
      # Optional: raise the GitHub API rate limit for GET /api/releases.
      # GITHUB_TOKEN: ""
