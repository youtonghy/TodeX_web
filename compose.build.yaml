# Override that builds the image from this checkout instead of pulling it.
# Requires a sibling TodeX_protocol checkout (or TODEX_PROTOCOL_DIR) and
# HEROUI_KEY in the shell; the key is forwarded as a BuildKit secret, never
# baked into layers.
services:
  web:
    build:
      context: .
      additional_contexts:
        todexprotocol: ${TODEX_PROTOCOL_DIR:-../TodeX_protocol}
      args:
        TODEX_BUILD_VERSION: ${TODEX_BUILD_VERSION:-DEV0.0.0}
      secrets:
        - HEROUI_KEY

secrets:
  HEROUI_KEY:
    environment: HEROUI_KEY
